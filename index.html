<style>
:root{--accent:#2F7D6D;--ink:#13302B;--muted:#53625E;--line:#E2D9CB;--bg:#F8F5EF;--soft:#EFE8DD;--card:#FFFDF9;--amber:#F2B544;--radius:20px;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sfont:Georgia,"Times New Roman",serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.bfont{font-family:var(--bfont),system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{margin:0;color:var(--ink);text-wrap:balance;font-family:var(--hfont,inherit)}
h1{font-size:clamp(2.6rem,7vw,5rem);font-weight:400;line-height:1.02;letter-spacing:-.045em}
h2{font-size:clamp(2rem,4.6vw,3.1rem);font-weight:400;line-height:1.08;letter-spacing:-.035em}
h3{font-size:1.12rem;font-weight:500;line-height:1.35;letter-spacing:-.01em}
.serif{font-family:var(--sfont);font-style:italic;font-weight:400;letter-spacing:-.01em;font-size:1.06em}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
section{padding:112px 0;scroll-margin-top:72px}
section.alt{background:var(--soft)}
.sec-head{max-width:640px;margin-bottom:48px}
.sec-head p{color:var(--muted);margin-top:18px;font-size:1.1rem}
.kicker,.eyebrow,.idx{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.kicker{display:flex;gap:14px;align-items:center;margin-bottom:20px;color:var(--muted)}
.kicker .n{opacity:.7}
.kicker .n::after{content:"";display:inline-block;width:28px;height:1px;background:currentColor;opacity:.4;vertical-align:middle;margin-left:14px}
.idx{color:var(--accent)}

/* header: transparent over the hero video, solid once you scroll */
.top{position:fixed;left:0;right:0;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:background .35s,border-color .35s}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.brand{font-weight:500;font-size:1.2rem;letter-spacing:-.03em;transition:color .35s}
.top.over{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.top.over .brand{color:#fff}
.top.over .btn.sm{background:var(--amber);color:var(--ink)}
.progress{position:absolute;left:0;top:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(var(--p,0));background:var(--amber)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;font:inherit;font-weight:500;font-size:1rem;background:var(--ink);color:#fff;padding:15px 28px;border-radius:999px;text-decoration:none;transition:background .2s,transform .05s}
.btn:not(.ghost)::after{content:"\2192";transition:transform .2s}
.btn:hover{background:color-mix(in srgb,var(--ink) 82%,var(--accent))}
.btn:hover::after{transform:translateX(3px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:wait}
.btn:focus-visible,summary:focus-visible,input:focus-visible,.row-item:focus-visible,.textlink:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.sm{padding:10px 18px;font-size:.9rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.block{display:flex;width:100%;justify-content:center}
.btn.amber{background:var(--amber);color:var(--ink);font-weight:700}
.btn.amber:hover{background:#F5C163}
.btn.lg{font-size:1.08rem;padding:18px 32px}

/* hero: full-bleed video under a deep green shade */
.hero{position:relative;min-height:min(100svh,920px);display:flex;align-items:center;padding:150px 0 130px;background:var(--ink);overflow:hidden}
.hero .bg{position:absolute;inset:0;z-index:0}
.hero .bg video,.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,60% 50%);display:block}
.hero .shade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(19,48,43,.94) 0%,rgba(19,48,43,.8) 38%,rgba(19,48,43,.42) 75%,rgba(19,48,43,.3) 100%),linear-gradient(0deg,rgba(19,48,43,.7) 0%,rgba(19,48,43,0) 40%)}
.hero .wrap{position:relative;z-index:2;width:100%}
.hero .inner{max-width:760px}

.hero p.sub{font-size:1.25rem;line-height:1.6;color:rgba(255,255,255,.84);margin:30px 0 42px;max-width:580px}
.hero .note{font-size:.88rem;color:rgba(255,255,255,.6);margin-top:18px}
.cue{position:absolute;z-index:2;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--mono);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.cue i{display:block;width:1px;height:38px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));animation:cue 2.4s var(--ease) infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0);opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}

/* 01 problem: fixed heading on the left, numbered lines on the right */
.split{display:grid;gap:40px}

.rows{border-top:1px solid var(--line)}
.row-item{display:grid;grid-template-columns:58px 1fr 28px;gap:18px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:28px 8px;font:inherit;color:inherit;cursor:pointer;transition:background .25s}
.row-item .num{font-family:var(--sfont);font-style:italic;font-size:2.1rem;line-height:1;color:var(--accent)}
.row-item .txt{font-size:1.14rem;line-height:1.5}
.row-item .tick{width:28px;height:28px;border-radius:50%;border:1px solid #A9B3AF;display:grid;place-items:center;font-size:.82rem;font-weight:700;color:transparent;margin-top:2px;transition:background .2s,border-color .2s,color .2s}
.row-item:hover{background:rgba(19,48,43,.035)}
.row-item[aria-pressed="true"]{background:rgba(242,181,68,.12)}
.row-item[aria-pressed="true"] .tick{background:var(--amber);border-color:var(--amber);color:var(--ink)}

/* 02 how it works: a connected timeline */
.timeline{display:grid;gap:44px}
@media(min-width:900px){.timeline{grid-template-columns:repeat(3,1fr);gap:48px}}
.tl-num{display:flex;align-items:center;gap:18px;font-family:var(--sfont);font-style:italic;font-size:4.4rem;line-height:.9;color:var(--accent)}
.tl-num::after{content:"";flex:1;height:1px;background:var(--line);transform:translateY(6px)}
.tl-step h3{font-size:1.28rem;margin-top:26px;letter-spacing:-.02em}
.tl-step p{color:var(--muted);margin-top:12px}

/* bridge: a quiet mid-page prompt */
.bridge{padding:60px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.bridge .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:22px 48px}
.bridge p{font-family:var(--sfont);font-style:italic;font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.15;letter-spacing:-.01em;max-width:700px}
.textlink{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0 0 5px;border-bottom:2px solid var(--amber);font:inherit;font-weight:500;font-size:1.05rem;color:var(--ink);cursor:pointer}
.textlink::after{content:"\2192";transition:transform .2s}
.textlink:hover::after{transform:translateX(3px)}

/* 03 gains (unchanged layout) */
.grid{display:grid;gap:16px}
details.feat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
details.feat summary{list-style:none;cursor:pointer;padding:24px 26px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:start;border-radius:var(--radius)}
details.feat summary::-webkit-details-marker{display:none}
details.feat .idx{padding-top:4px}
details.feat summary .s{color:var(--muted);font-size:.98rem;margin-top:6px;font-weight:400}
details.feat summary .pm{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:1.1rem;line-height:1;color:var(--ink);transition:transform .2s}
details.feat[open] summary .pm{transform:rotate(45deg)}
details.feat .d{padding:0 26px 24px 26px;color:var(--muted);max-width:720px}
@media(min-width:640px){details.feat .d{padding-left:78px}}

/* pricing (off for this idea, kept for the template) */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px}
.card p{color:var(--muted);margin-top:10px}
@media(min-width:760px){.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c2{grid-template-columns:repeat(2,1fr)}}
.tier{display:flex;flex-direction:column;position:relative}
.tier.hl{border:2px solid var(--accent)}
.tier .tag{position:absolute;top:-12px;left:20px;background:var(--accent);color:#fff;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px}
.tier .price{font-size:2rem;font-weight:500;letter-spacing:-.03em;margin-top:12px;font-variant-numeric:tabular-nums}
.tier .per{font-size:.9rem;color:var(--muted);font-weight:400}
.tier ul{list-style:none;padding:0;margin:16px 0 22px;display:grid;gap:8px;flex:1}
.tier li{padding-left:24px;position:relative;font-size:.97rem}
.tier li::before{content:"\2713";position:absolute;left:0;color:var(--accent);font-weight:700}

/* 04 sign-up band */
.cta-band{background:var(--ink);color:#fff;padding:120px 0}
.cta-band .kicker{color:#9FD3C4}
.cta-band h2{color:#fff}
.cta-grid{display:grid;gap:44px;align-items:center}
@media(min-width:900px){.cta-grid{grid-template-columns:1fr 1fr;gap:80px}}
.cta-line{font-size:1.18rem;line-height:1.6;color:rgba(255,255,255,.82);margin-top:26px;max-width:440px}
.cta-card{background:var(--card);color:var(--ink);border-radius:24px;padding:38px;box-shadow:0 30px 70px rgba(0,0,0,.28)}
.cta-card h3{font-size:1.35rem;font-weight:500;letter-spacing:-.02em}
.cta-card .lead{color:var(--muted);margin-top:6px}
.cta-card label,.cta-card .q-label{display:block;font-weight:500;font-size:.95rem;margin:0 0 10px}
.cta-card input{width:100%;font:inherit;font-size:1.08rem;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff;color:inherit}
.cta-card .btn.amber{font-size:1.12rem;padding:18px 28px;margin-top:14px}
.cta-card .micro{font-size:.9rem;color:var(--muted);margin-top:14px;text-align:center}
.cta-card .err{font-size:.9rem;color:#b91c1c;margin-top:12px}
.cta-card .fineprint{font-size:.8rem;color:var(--muted);margin-top:18px;line-height:1.5}
.cta-card .q{margin-top:24px}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 15px;font:inherit;font-size:.95rem;cursor:pointer;transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cta-actions{display:flex;align-items:center;gap:18px;margin-top:28px;flex-wrap:wrap}
.cta-actions .btn{margin-top:0}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
.pill{display:inline-block;font-size:.85rem;font-weight:500;background:color-mix(in srgb,var(--accent) 10%,white);color:var(--accent);padding:4px 12px;border-radius:999px;margin-bottom:10px}
.preview-flag{font-size:.85rem;background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:10px;padding:10px 12px;margin-top:16px}

/* 05 FAQ: heading left, questions right */
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line);padding:24px 0}
.faq summary{cursor:pointer;font-weight:500;font-size:1.12rem;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--accent);font-size:1.4rem;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);margin-top:12px;max-width:620px}

/* footer, overlay, consent */
footer{border-top:1px solid var(--line);padding:40px 0 104px;font-size:.88rem;color:var(--muted)}
footer details{margin-top:10px;max-width:640px}

.overlay{position:fixed;inset:0;background:rgba(19,48,43,.5);display:none;place-items:center;padding:20px;z-index:50}
.overlay.on{display:grid}
.modal{background:var(--card);border-radius:24px;padding:32px;max-width:440px;width:100%}
.modal p{color:var(--muted);margin:12px 0 22px}
.modal .row{display:flex;gap:10px;flex-wrap:wrap}

.mbar{display:none}
@media(max-width:760px){
  .mbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:35;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .4s var(--ease)}
  .mbar.on{transform:none}
  body.mbar-on .consent{bottom:84px}
}

/* scroll reveal (only when scripts run and motion is allowed) */
.js .rv{opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.js .rv.in{opacity:1;transform:none}

@media(max-width:640px){
  section{padding:76px 0}
  .hero{min-height:88svh;padding:120px 0 96px}
  .hero .shade{background:linear-gradient(0deg,rgba(19,48,43,.92) 0%,rgba(19,48,43,.72) 55%,rgba(19,48,43,.55) 100%)}
  .hero p.sub{font-size:1.1rem;margin:24px 0 32px}
  .cue{display:none}
  .sec-head{margin-bottom:34px}
  .row-item{grid-template-columns:44px 1fr 26px;gap:12px;padding:22px 4px}
  .row-item .num{font-size:1.7rem}
  .row-item .txt{font-size:1.04rem}
  .tl-num{font-size:3.4rem}
  .bridge{padding:44px 0}
  .cta-band{padding:76px 0}
  .cta-card{padding:24px}
  .top .btn.sm{padding:9px 14px;font-size:.85rem}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}.js .rv{opacity:1;transform:none}}
